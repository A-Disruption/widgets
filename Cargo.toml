[package]
name = "widgets"
version = "0.1.0"
edition = "2024"

[dependencies]
# Pinned to the rev admin_tools/networkmap uses so a consuming workspace shares
# one iced build (floating `branch = "master"` otherwise).
iced = { git = "https://github.com/iced-rs/iced", rev = "4cad51ba61e3d76a7e696ad5923d675a20994e34", features = ["tokio", "advanced", "debug"] }
chrono = { version = "0.4", optional = true }

[dev-dependencies]
iced_runtime = { git = "https://github.com/iced-rs/iced", rev = "4cad51ba61e3d76a7e696ad5923d675a20994e34" }

[features]
default = []
tree = []
color_picker = []
color_picker_two = []
collapsible = []
generic_overlay = []
flow_editor = []
date_picker = ["dep:chrono"]
all = ["tree", "color_picker", "color_picker_two", "collapsible", "generic_overlay", "flow_editor", "date_picker"]

[[example]]
name = "tree_example"
path = "examples/tree_example.rs"
required-features = ["tree"]

[[example]]
name = "tree_in_collapsible"
path = "examples/tree_in_collapsible_example.rs"
required-features = ["tree", "collapsible"]

[[example]]
name = "color_picker_example"
path = "examples/color_picker_example.rs"
required-features = ["color_picker"]

[[example]]
name = "color_picker_two_example"
path = "examples/color_picker_two_example.rs"
required-features = ["color_picker_two"]

[[example]]
name = "collapsible_example"
path = "examples/collapsible_example.rs"
required-features = ["collapsible"]

[[example]]
name = "generic_overlay_example"
path = "examples/generic_overlay_example.rs"
required-features = ["generic_overlay"]

[[example]]
name = "flow_editor_example"
path = "examples/flow_editor_example.rs"
required-features = ["flow_editor"]

[[example]]
name = "date_picker_example"
path = "examples/date_picker_example.rs"
required-features = ["date_picker"]
