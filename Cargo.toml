[package]
name = "widgets"
version = "0.1.0"
edition = "2024"

[dependencies]
iced = { version = "0.15.0-dev", features = ["tokio", "advanced", "debug"] }
chrono = { version = "0.4", optional = true }
# Optional, behind `m3_theme`. Consumers that don't want Material Design 3
# styling never pull this in.
material_theme = { git = "https://github.com/A-Disruption/material_theme", optional = true }

[dev-dependencies]
iced_runtime = { version = "0.15.0-dev" }

# `iced` is asked for by version above and pointed at a source here, so nothing
# about where it comes from is baked into the dependency itself. A consumer can
# aim this at another branch, a fork, or a local checkout without this crate
# knowing, and every crate in the graph asking for `iced 0.15.0-dev` follows —
# which is what keeps `Element` and `Theme` one type across all of them. Pinning
# the same `rev` in every crate was the old way of getting that, and it meant
# the whole graph had to move in lockstep.
#
# 0.15 is unreleased, so this block is not optional: cargo cannot resolve
# `iced 0.15.0-dev` from crates.io without it. And cargo only honours `[patch]`
# in the manifest of the workspace being built, so a crate that depends on this
# one needs its own copy.
[patch.crates-io]
iced = { git = "https://github.com/iced-rs/iced.git", branch = "master" }
iced_runtime = { git = "https://github.com/iced-rs/iced.git", branch = "master" }

[features]
default = []
# Shared base-relative placement used by the anchored widgets.
anchor = []
# Shared open/close transitions used by the overlay-backed widgets.
animation = ["anchor"]
# The embedded Lucide icon font, shared by widgets that draw their own glyphs.
lucide = []
layer = ["anchor", "animation"]
menu = ["anchor", "animation", "lucide"]
popover = ["anchor", "animation"]
toast = ["anchor", "animation", "lucide"]
# `tree` and `collapsible` draw their default disclosure chevron from the
# embedded Lucide font, the same one `menu` uses.
tree = ["lucide"]
color_picker_two = []
collapsible = ["lucide"]
date_picker = ["dep:chrono"]
# Material Design 3 styles for the widgets above, in `widgets::m3`.
m3_theme = ["dep:material_theme"]
all = ["anchor", "animation", "layer", "lucide", "menu", "popover", "toast", "tree", "color_picker_two", "collapsible", "date_picker"]

[[example]]
name = "toast_example"
path = "examples/toast_example.rs"
required-features = ["toast"]

[[example]]
name = "layer_example"
path = "examples/layer_example.rs"
required-features = ["layer"]

[[example]]
name = "popover_example"
path = "examples/popover_example.rs"
required-features = ["popover"]

[[example]]
name = "menu_example"
path = "examples/menu_example.rs"
required-features = ["menu"]

[[example]]
name = "tree_example"
path = "examples/tree_example.rs"
required-features = ["tree"]

[[example]]
name = "tree_in_collapsible"
path = "examples/tree_in_collapsible_example.rs"
required-features = ["tree", "collapsible"]

[[example]]
name = "color_picker_two_example"
path = "examples/color_picker_two_example.rs"
required-features = ["color_picker_two"]

[[example]]
name = "collapsible_example"
path = "examples/collapsible_example.rs"
required-features = ["collapsible"]

[[example]]
name = "date_picker_example"
path = "examples/date_picker_example.rs"
required-features = ["date_picker"]
